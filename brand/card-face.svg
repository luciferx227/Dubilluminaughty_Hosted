  <!-- Corner pips. -->
  <g fill="none" stroke="#dbb152" stroke-width="7" stroke-linejoin="miter">
    <path d="M 8 152 L 1 2 L 15 38 L 22.5 22 L 50 67 L 70.5 32 L 92 67 L 119.5 22 L 128 38 L 142 2 L 135 152" transform="translate(52 52) scale(0.26)"/>
